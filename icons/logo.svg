<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14894A"/>
      <stop offset="1" stop-color="#0A5A2F"/>
    </linearGradient>
    <radialGradient id="ball" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.7" stop-color="#F1F3F1"/>
      <stop offset="1" stop-color="#D3D9D4"/>
    </radialGradient>
    <pattern id="dimples" width="34" height="30" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="6.2" fill="#C9D0CA" opacity="0.55"/>
      <circle cx="25" cy="23" r="6.2" fill="#C9D0CA" opacity="0.55"/>
    </pattern>
    <clipPath id="ballClip"><circle cx="256" cy="244" r="196"/></clipPath>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- fairway stripes -->
  <g opacity="0.07" fill="#FFFFFF">
    <rect x="0" y="0" width="512" height="64"/>
    <rect x="0" y="128" width="512" height="64"/>
    <rect x="0" y="256" width="512" height="64"/>
    <rect x="0" y="384" width="512" height="64"/>
  </g>
  <!-- shadow -->
  <ellipse cx="256" cy="458" rx="150" ry="18" fill="#000" opacity="0.25"/>
  <!-- ball -->
  <circle cx="256" cy="244" r="196" fill="url(#ball)"/>
  <rect x="40" y="40" width="440" height="420" fill="url(#dimples)" clip-path="url(#ballClip)"/>
  <circle cx="256" cy="244" r="196" fill="none" stroke="#0A5A2F" stroke-opacity="0.25" stroke-width="4"/>
  <!-- wordmark -->
  <text x="256" y="300" text-anchor="middle" font-family="Montserrat" font-weight="900" font-size="148" letter-spacing="-4" fill="#0B6E3A" stroke="#FFFFFF" stroke-width="10" paint-order="stroke">GD$</text>
</svg>
